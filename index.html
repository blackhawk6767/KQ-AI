<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KQ AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050507;
    --panel: #0c0c11;
    --panel2: #111118;
    --border: #24242e;
    --purple: #9b5cff;
    --purple2: #6d2fd1;
    --green: #7cffaa;
    --text: #f4f4f7;
    --muted: #888894;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 70% 0%, #32145e55, transparent 35%),
        var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #09090d;
    border-right: 1px solid var(--border);
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.logo-box {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    box-shadow: 0 0 30px #8d4cff55;
}

.logo-text {
    font-size: 20px;
    font-weight: bold;
}

.logo-text span {
    color: var(--purple);
}

.new-chat {
    border: 1px solid #8e4cff66;
    background: #9b5cff16;
    color: white;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.new-chat:hover {
    background: #9b5cff25;
}

.history-title {
    margin: 25px 5px 10px;
    font-size: 11px;
    color: #666672;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.history {
    overflow-y: auto;
}

.history-item {
    width: 100%;
    border: none;
    background: transparent;
    color: #aaaab4;
    text-align: left;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #15151c;
    color: white;
}

.sidebar-bottom {
    margin-top: auto;
}

.sidebar-button {
    width: 100%;
    padding: 11px;
    border: none;
    background: transparent;
    color: #858591;
    text-align: left;
    border-radius: 9px;
    cursor: pointer;
}

.sidebar-button:hover {
    background: #15151c;
    color: white;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* TOP */

.top {
    height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #08080cdd;
    backdrop-filter: blur(10px);
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: bold;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--green);
}

.top-right {
    color: #777783;
    font-size: 13px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px 170px;
}

.chat-inner {
    max-width: 900px;
    margin: auto;
}

/* WELCOME */

.welcome {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.orb {
    width: 95px;
    height: 95px;
    border-radius: 28px;
    background: radial-gradient(circle, #bd91ff, #7138d5 55%, #27103e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    box-shadow: 0 0 60px #9b5cff55;
    animation: float 3s infinite ease-in-out;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.welcome h1 {
    margin-top: 25px;
    font-size: 48px;
}

.welcome h1 span {
    color: var(--purple);
}

.welcome p {
    color: var(--muted);
    margin-top: 12px;
}

.examples {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 30px;
    width: min(650px, 100%);
}

.example {
    padding: 15px;
    border: 1px solid var(--border);
    background: #ffffff05;
    color: #ccc;
    border-radius: 13px;
    text-align: left;
    cursor: pointer;
}

.example:hover {
    border-color: #9b5cff66;
    background: #9b5cff0b;
}

.example b {
    display: block;
    color: white;
    margin-bottom: 5px;
}

/* MESSAGE */

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    animation: appear .2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    min-width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #14141c;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: var(--purple);
}

.user .avatar {
    color: var(--green);
}

.content {
    max-width: 80%;
}

.bubble {
    padding: 14px 16px;
    border-radius: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.ai .bubble {
    background: #ffffff04;
    border: 1px solid var(--border);
}

.user .bubble {
    background: linear-gradient(135deg, #2b1543, #1b1028);
    border: 1px solid #9b5cff33;
}

/* COMPOSER */

.composer-area {
    position: absolute;
    bottom: 0;
    left: 270px;
    right: 0;
    padding: 20px;
    background: linear-gradient(transparent, #050507 30%);
}

.composer {
    max-width: 900px;
    margin: auto;
    background: #101017;
    border: 1px solid #292934;
    border-radius: 18px;
    position: relative;
}

.composer:focus-within {
    border-color: #9b5cff88;
    box-shadow: 0 0 0 3px #9b5cff0b;
}

textarea {
    width: 100%;
    min-height: 65px;
    max-height: 170px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 17px 55px 17px 17px;
    font: inherit;
    line-height: 1.5;
}

textarea::placeholder {
    color: #656571;
}

.send {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.send:hover {
    box-shadow: 0 0 20px #9b5cff66;
}

.disclaimer {
    text-align: center;
    color: #555560;
    font-size: 10px;
    margin-top: 7px;
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
    padding: 10px 3px;
}

.typing span {
    width: 7px;
    height: 7px;
    background: var(--purple);
    border-radius: 50%;
    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%,100% {
        opacity: .2;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* MOBILE */

@media(max-width: 750px) {

    .sidebar {
        display: none;
    }

    .welcome h1 {
        font-size: 36px;
    }

    .examples {
        grid-template-columns: 1fr;
    }

    .composer-area {
        left: 0;
        padding: 10px;
    }

    .chat {
        padding-bottom: 160px;
    }

    .content {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-box">
                KQ
            </div>

            <div class="logo-text">
                KQ <span>AI</span>
            </div>

        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Nowa rozmowa
        </button>

        <div class="history-title">
            Historia
        </div>

        <div id="history" class="history"></div>

        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                onclick="clearHistory()"
            >
                🗑 Wyczyść historię
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="top">

            <div class="status">

                <div class="status-dot"></div>

                KQ AI

            </div>

            <div class="top-right">
                Lokalny silnik • v1.0
            </div>

        </header>


        <section id="chat" class="chat">

            <div id="chatInner" class="chat-inner">

                <!-- WELCOME -->

                <div id="welcome" class="welcome">

                    <div class="orb">
                        KQ
                    </div>

                    <h1>
                        Witaj w
                        <span>KQ AI</span>
                    </h1>

                    <p>
                        Prosty inteligentny asystent KQ 🤖
                    </p>


                    <div class="examples">

                        <button
                            class="example"
                            onclick="example('Ile to 25 + 37?')"
                        >
                            <b>🧮 Matematyka</b>
                            Ile to 25 + 37?
                        </button>


                        <button
                            class="example"
                            onclick="example('Jaka jest stolica Polski?')"
                        >
                            <b>🌍 Wiedza</b>
                            Jaka jest stolica Polski?
                        </button>


                        <button
                            class="example"
                            onclick="example('Kim jesteś?')"
                        >
                            <b>🤖 KQ AI</b>
                            Kim jesteś?
                        </button>


                        <button
                            class="example"
                            onclick="example('Opowiedz mi ciekawostkę')"
                        >
                            <b>💡 Ciekawostka</b>
                            Opowiedz mi ciekawostkę
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="composer-area">

            <div class="composer">

                <textarea
                    id="input"
                    placeholder="Napisz coś do KQ AI..."
                ></textarea>

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

            <div class="disclaimer">
                KQ AI działa lokalnie i nie korzysta z zewnętrznego API.
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   KQ AI — LOKALNY SILNIK
   ========================================================= */

const input =
    document.getElementById("input");

const chatInner =
    document.getElementById("chatInner");

const chat =
    document.getElementById("chat");

const history =
    document.getElementById("history");

let messages = [];


/* =========================================================
   WYSYŁANIE
   ========================================================= */

function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;


    document
        .getElementById("welcome")
        ?.remove();


    addMessage(
        "user",
        text
    );


    messages.push({
        role: "user",
        text: text
    });


    input.value = "";

    input.style.height = "auto";


    showTyping();


    setTimeout(() => {

        hideTyping();


        const answer =
            KQAI(text);


        addMessage(
            "ai",
            answer
        );


        messages.push({
            role: "ai",
            text: answer
        });


        saveHistory();

    }, 500);

}


/* =========================================================
   KQ AI — MÓZG
   ========================================================= */

function KQAI(question) {

    const q =
        question
            .toLowerCase()
            .trim();


    /* POWITANIA */

    if (
        q.includes("cześć") ||
        q.includes("czesc") ||
        q.includes("hej") ||
        q.includes("siema") ||
        q.includes("witaj")
    ) {

        return "Hej! 👋 Jestem KQ AI. W czym mogę Ci pomóc?";

    }


    /* KIM JESTEŚ */

    if (
        q.includes("kim jesteś") ||
        q.includes("kim jestes") ||
        q.includes("co to jesteś") ||
        q.includes("co to jest kq ai")
    ) {

        return "Jestem KQ AI 🤖 — prostym asystentem stworzonym dla ekosystemu KQ.";

    }


    /* STOLICA POLSKI */

    if (
        q.includes("stolica polski") ||
        q.includes("stolicą polski")
    ) {

        return "Stolicą Polski jest Warszawa 🇵🇱.";

    }


    /* POLSKA */

    if (
        q === "polska" ||
        q.includes("gdzie leży polska")
    ) {

        return "Polska znajduje się w Europie Środkowej 🇵🇱.";

    }


    /* DZISIAJ */

    if (
        q.includes("jaki dzisiaj dzień") ||
        q.includes("jaki jest dzisiaj dzień") ||
        q.includes("data")
    ) {

        const today =
            new Date();

        return "Dzisiaj jest " +
            today.toLocaleDateString(
                "pl-PL",
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            ) + ".";

    }


    /* CZAS */

    if (
        q.includes("która godzina") ||
        q.includes("jaka godzina") ||
        q.includes("godzina")
    ) {

        return "Teraz jest " +
            new Date().toLocaleTimeString(
                "pl-PL",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ) + " ⏰";

    }


    /* KQ */

    if (
        q.includes("kq games")
    ) {

        return "KQ Games 🎮 to część Twojego ekosystemu KQ. Możemy później połączyć KQ Games, KQ AI i KQGame Chat w jeden panel.";

    }


    /* MATEMATYKA */

    const math =
        q.match(
            /^[\d\s+\-*/().]+$/
        );


    if (math) {

        try {

            const result =
                Function(
                    '"use strict"; return (' +
                    q +
                    ')'
                )();


            if (
                typeof result === "number" &&
                Number.isFinite(result)
            ) {

                return "Wynik: **" +
                    result +
                    "** 🧮";

            }

        } catch(e) {}

    }


    /* DODAWANIE */

    const addition =
        q.match(
            /ile to (\d+)\s*\+\s*(\d+)/i
        );


    if (addition) {

        const a =
            Number(addition[1]);

        const b =
            Number(addition[2]);

        return "Wynik: " +
            (a + b) +
            " 🧮";

    }


    /* ODEJMOWANIE */

    const subtraction =
        q.match(
            /ile to (\d+)\s*-\s*(\d+)/i
        );


    if (subtraction) {

        const a =
            Number(subtraction[1]);

        const b =
            Number(subtraction[2]);

        return "Wynik: " +
            (a - b) +
            " 🧮";

    }


    /* MNOŻENIE */

    const multiplication =
        q.match(
            /ile to (\d+)\s*(?:\*|x|×)\s*(\d+)/i
        );


    if (multiplication) {

        const a =
            Number(multiplication[1]);

        const b =
            Number(multiplication[2]);

        return "Wynik: " +
            (a * b) +
            " 🧮";

    }


    /* DZIELENIE */

    const division =
        q.match(
            /ile to (\d+)\s*(?:\/|÷)\s*(\d+)/i
        );


    if (division) {

        const a =
            Number(division[1]);

        const b =
            Number(division[2]);

        if (b === 0) {

            return "Nie można dzielić przez zero 😅";

        }

        return "Wynik: " +
            (a / b) +
            " 🧮";

    }


    /* CIEKAWOSTKA */

    if (
        q.includes("ciekawost")
    ) {

        const facts = [

            "Ośmiornice mają trzy serca 🐙.",

            "Banany są botanicznie jagodami 🍌.",

            "Miód może bardzo długo zachować swoje właściwości 🍯.",

            "Serce kolibra może bić bardzo szybko podczas lotu 🐦.",

            "Na Ziemi istnieje więcej drzew niż gwiazd w Drodze Mlecznej 🌳."

        ];


        return facts[
            Math.floor(
                Math.random() *
                facts.length
            )
        ];

    }


    /* POMOC */

    if (
        q.includes("pomóż") ||
        q.includes("pomoz") ||
        q.includes("co potrafisz")
    ) {

        return `
Na razie potrafię:

🧮 wykonywać proste działania
🌍 odpowiadać na kilka podstawowych pytań
🤖 odpowiadać na pytania o KQ AI
💡 podawać ciekawostki
⏰ sprawdzać godzinę
📅 sprawdzać datę

To dopiero początek KQ AI 🚀
        `.trim();

    }


    /* DOMYŚLNA */

    return `
Nie znam jeszcze odpowiedzi na to pytanie 😅

Możesz spróbować zapytać mnie o:

• matematykę 🧮
• stolicę Polski 🇵🇱
• godzinę ⏰
• datę 📅
• KQ AI 🤖
• ciekawostki 💡

Z czasem możemy rozbudować mózg KQ AI o dużo więcej odpowiedzi.
    `.trim();

}


/* =========================================================
   WIADOMOŚĆ
   ========================================================= */

function addMessage(
    type,
    text
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "ai"
            ? "KQ"
            : "TY";


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "content";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    /* Proste formatowanie */

    bubble.innerHTML =
        escapeHTML(text)
            .replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


    content.appendChild(
        bubble
    );


    message.appendChild(
        avatar
    );

    message.appendChild(
        content
    );


    chatInner.appendChild(
        message
    );


    scrollBottom();

}


/* =========================================================
   BEZPIECZNY TEKST
   ========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping() {

    const typing =
        document.createElement(
            "div"
        );

    typing.id =
        "typing";

    typing.className =
        "message ai";


    typing.innerHTML = `

        <div class="avatar">
            KQ
        </div>

        <div class="content">

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>
    `;


    chatInner.appendChild(
        typing
    );


    scrollBottom();

}


function hideTyping() {

    document
        .getElementById(
            "typing"
        )
        ?.remove();

}


/* =========================================================
   NOWA ROZMOWA
   ========================================================= */

function newChat() {

    messages = [];


    chatInner.innerHTML = `

        <div
            id="welcome"
            class="welcome"
        >

            <div class="orb">
                KQ
            </div>

            <h1>
                Witaj w
                <span>KQ AI</span>
            </h1>

            <p>
                Prosty inteligentny asystent KQ 🤖
            </p>

        </div>

    `;

}


/* =========================================================
   PRZYKŁADOWE PYTANIA
   ========================================================= */

function example(text) {

    input.value =
        text;

    input.focus();

    sendMessage();

}


/* =========================================================
   ENTER
   ========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTOMATYCZNA WYSOKOŚĆ
   ========================================================= */

input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                170
            ) + "px";

    }
);


/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom() {

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 20);

}


/* =========================================================
   HISTORIA
   ========================================================= */

function saveHistory() {

    if (
        messages.length === 0
    ) return;


    const old =
        JSON.parse(
            localStorage.getItem(
                "kqAIHistory"
            ) || "[]"
        );


    const first =
        messages.find(
            x => x.role === "user"
        );


    const item = {

        title:
            first
                ? first.text.slice(0, 35)
                : "Nowa rozmowa",

        messages:
            messages,

        date:
            Date.now()

    };


    old.unshift(item);


    localStorage.setItem(
        "kqAIHistory",
        JSON.stringify(
            old.slice(0, 20)
        )
    );


    loadHistory();

}


/* =========================================================
   WCZYTAJ HISTORIĘ
   ========================================================= */

function loadHistory() {

    history.innerHTML =
        "";


    const saved =
        JSON.parse(
            localStorage.getItem(
                "kqAIHistory"
            ) || "[]"
        );


    saved.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "history-item";


            button.textContent =
                item.title;


            button.onclick =
                () => {

                    messages =
                        item.messages;


                    chatInner.innerHTML =
                        "";


                    messages.forEach(
                        message => {

                            addMessage(
                                message.role,
                                message.text
                            );

                        }
                    );

                };


            history.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   WYCZYŚĆ HISTORIĘ
   ========================================================= */

function clearHistory() {

    localStorage.removeItem(
        "kqAIHistory"
    );

    loadHistory();

}


/* START */

loadHistory();
